services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: men-app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set (e.g. Aiven PostgreSQL URI)}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_PRIMARY_MODEL: ${GEMINI_PRIMARY_MODEL:-gemini-3.8-flash}
      GEMINI_FALLBACK_MODEL: ${GEMINI_FALLBACK_MODEL:-gemini-3.5-flash-lite}
      GEMINI_ENABLE_FALLBACK: ${GEMINI_ENABLE_FALLBACK:-false}
      GEMINI_LOG_RETENTION_DAYS: ${GEMINI_LOG_RETENTION_DAYS:-30}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID}
      TELEGRAM_ADMIN_CHAT_ID: ${TELEGRAM_ADMIN_CHAT_ID}
      TIMEZONE: ${TIMEZONE:-Asia/Tehran}
      COLLECTION_INTERVAL_MINUTES: ${COLLECTION_INTERVAL_MINUTES:-60}
      DAILY_REPORT_HOUR: ${DAILY_REPORT_HOUR:-8}
      DAILY_REPORT_MINUTE: ${DAILY_REPORT_MINUTE:-0}
      MAX_ARTICLES_PER_BATCH: ${MAX_ARTICLES_PER_BATCH:-50}
      MIN_IMPORTANCE: ${MIN_IMPORTANCE:-2}
    networks:
      - men-net

networks:
  men-net:
    driver: bridge
