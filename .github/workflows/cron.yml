name: Scheduled Batch Runner

on:
  schedule:
    # The production cadence is an external cron-job.org job that calls this workflow
    # once an hour on the hour (Asia/Tehran), i.e. 24 guaranteed runs per day. The two
    # schedules kept here are only the backup chance for the two briefing slots
    # (08:00 and 20:00 Tehran, each covering 12 hours); the removed middle-of-the-day
    # schedules would duplicate the hourly external run and only queue up behind the
    # `scheduled-batch-runner` concurrency group.
    - cron: '30 4 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      force_daily_report:
        description: 'Force daily report publishing regardless of current time'
        required: false
        default: false
        type: boolean
      dry_run_daily_report:
        description: 'Generate report in dry-run mode (skip Telegram sending)'
        required: false
        default: false
        type: boolean
      slot_hour:
        description: 'Briefing slot to publish (8 or 20); empty = the slot that is now due'
        required: false
        default: ''
        type: string

concurrency:
  group: scheduled-batch-runner
  # Never cancel a run that is still working: an interrupted batch leaves the queue
  # half-processed and the hourly cycle would restart from scratch forever. A run that
  # overruns simply makes the next one wait for the group instead of killing it.
  cancel-in-progress: false

jobs:
  run-batch:
    name: Batch Ingestion & Daily Report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Free-tier gemini-3.8-flash answers 503 for hours and allows only 20 requests
      # per day, so the default when the repository variable is unset is a Lite model.
      GEMINI_PRIMARY_MODEL: ${{ vars.GEMINI_PRIMARY_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.1-flash-lite' }}
      # Last resort: both Lite models answer 503 at peak hours, so the batch continues on
      # a non-Lite model instead of failing the article and tripping the circuit breaker.
      GEMINI_TERTIARY_MODEL: ${{ vars.GEMINI_TERTIARY_MODEL || 'gemini-2.5-flash' }}
      GEMINI_ENABLE_FALLBACK: ${{ vars.GEMINI_ENABLE_FALLBACK || 'true' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      # The full 12-hour bulletin belongs on Telegraph; Telegram carries the notification
      # with the index link. TELEGRAPH_ENABLED=false keeps the previous behaviour exactly:
      # the full bulletin text is sent to Telegram instead. Enable it (repository variable)
      # only after TELEGRAPH_ACCESS_TOKEN exists, or production would create throwaway
      # accounts whose pages can never be edited.
      TELEGRAPH_ENABLED: ${{ vars.TELEGRAPH_ENABLED || 'false' }}
      TELEGRAPH_ACCESS_TOKEN: ${{ secrets.TELEGRAPH_ACCESS_TOKEN }}
      TELEGRAPH_AUTHOR_NAME: ${{ vars.TELEGRAPH_AUTHOR_NAME || 'پایش تحولات خاورمیانه' }}
      TELEGRAPH_AUTHOR_URL: ${{ vars.TELEGRAPH_AUTHOR_URL || '' }}
      TELEGRAPH_SHORT_NAME: ${{ vars.TELEGRAPH_SHORT_NAME || 'middle_east_news' }}
      # Pre-migration backup: same destination and credentials as backup.yml, resolved by
      # the shared script so the two workflows cannot drift apart.
      BACKUP_STORAGE: ${{ vars.BACKUP_STORAGE }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME || 'newsbot-backups' }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'newsbot-backups' }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_APPLICATION_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      # Editorial guards: log every numeric mismatch, and send one admin alert per run
      # about the articles parked for review. Override any of these with a repository
      # variable of the same name; the defaults are the safe, non-blocking behaviour.
      NUMBER_CHECK_MODE: ${{ vars.NUMBER_CHECK_MODE || 'log' }}
      FLAG_ALERT_ENABLED: ${{ vars.FLAG_ALERT_ENABLED || 'true' }}
      FLAG_ALERT_MAX_PER_RUN: ${{ vars.FLAG_ALERT_MAX_PER_RUN || '5' }}
      # 35 articles keeps a full cycle comfortably under 15-20 minutes, so a run never
      # spills into the next hourly trigger even when several model calls are slow.
      MAX_ARTICLES_PER_BATCH: ${{ vars.MAX_ARTICLES_PER_BATCH || '35' }}
      TIMEZONE: 'Asia/Tehran'
      DAILY_REPORT_HOUR: '8'
      FORCE_DAILY_REPORT: ${{ inputs.force_daily_report || 'false' }}
      DRY_RUN_DAILY_REPORT: ${{ inputs.dry_run_daily_report || 'false' }}
      # Publish the briefing of the slot that just came due (08:00/20:00 Tehran). A slot
      # stays publishable for SLOT_GRACE_HOURS after it starts, so a late run still ships it.
      SCHEDULED_BRIEFINGS: 'true'
      SLOT_GRACE_HOURS: ${{ vars.SLOT_GRACE_HOURS || '6' }}
      REPORT_SLOTS: '8,20'
      # Phase Y-9: articles older than this many hours are stored as 'expired' and
      # never sent to the model, so the queue cannot grow without bound.
      ARTICLE_MAX_AGE_HOURS: ${{ vars.ARTICLE_MAX_AGE_HOURS || '24' }}
      # A manual run usually happens after the slot's window closed; naming the slot
      # lets it report on that slot's window instead of the one that is now due.
      REPORT_SLOT_HOUR: ${{ inputs.slot_hour }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps 'aiogram==3.22.0'
          pip install -r requirements-dev.txt

      - name: Install rclone for the pre-migration backup
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Resolve backup storage
        run: bash scripts/resolve_backup_storage.sh

      # Fail-closed: a pending migration runs only after a dump that pg_restore accepts
      # and that is verified at the destination. No pending migration = no backup and
      # no bucket writes, so the normal runs leave the free tier untouched.
      - name: Migrate only after a verified backup
        run: bash scripts/migrate_with_backup.sh

      - name: Execute single-run batch pipeline
        run: python scripts/run_once.py

      # A dry run sends nothing, so the only way to review what the reader would have
      # received is the bulletin text (and Telegraph link) the job writes into scratch/.
      - name: Upload dry-run bulletin evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-briefing
          path: scratch/
          if-no-files-found: ignore
          retention-days: 7
