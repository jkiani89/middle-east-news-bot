name: Scheduled Batch Runner

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
    # Scheduled briefings in Tehran time (UTC+3:30): 08:00, 14:00 and 20:00
    - cron: '30 4 * * *'
    - cron: '30 10 * * *'
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      force_daily_report:
        description: 'Force daily report publishing regardless of current time'
        required: false
        default: false
        type: boolean
      dry_run_daily_report:
        description: 'Generate report in dry-run mode (skip Telegram sending)'
        required: false
        default: false
        type: boolean

concurrency:
  group: scheduled-batch-runner
  cancel-in-progress: false

jobs:
  run-batch:
    name: Batch Ingestion & Daily Report
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Free-tier gemini-3.8-flash answers 503 for hours and allows only 20 requests
      # per day, so the default when the repository variable is unset is a Lite model.
      GEMINI_PRIMARY_MODEL: ${{ vars.GEMINI_PRIMARY_MODEL || 'gemini-3.5-flash-lite' }}
      GEMINI_FALLBACK_MODEL: ${{ vars.GEMINI_FALLBACK_MODEL || 'gemini-3.1-flash-lite' }}
      GEMINI_ENABLE_FALLBACK: ${{ vars.GEMINI_ENABLE_FALLBACK || 'true' }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
      TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
      MAX_ARTICLES_PER_BATCH: '15'
      TIMEZONE: 'Asia/Tehran'
      DAILY_REPORT_HOUR: '8'
      FORCE_DAILY_REPORT: ${{ inputs.force_daily_report || 'false' }}
      DRY_RUN_DAILY_REPORT: ${{ inputs.dry_run_daily_report || 'false' }}
      # Publish the briefing of the slot that just came due (08:00/14:00/20:00 Tehran)
      SCHEDULED_BRIEFINGS: 'true'
      REPORT_SLOTS: '8,14,20'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.15
        uses: actions/setup-python@v5
        with:
          python-version: '3.15'
          allow-prereleases: true
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps 'aiogram==3.22.0'
          pip install -r requirements-dev.txt

      - name: Apply database schema migrations
        run: alembic upgrade head

      - name: Execute single-run batch pipeline
        run: python scripts/run_once.py
