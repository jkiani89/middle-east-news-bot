name: Scheduled Database Backup

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: scheduled-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup PostgreSQL to object storage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_RETENTION_DAYS: '7'
      # 'r2' (Cloudflare) or 'b2' (Backblaze). The optional repository variable
      # BACKUP_STORAGE overrides the choice; without it the provider is inferred from the
      # credentials that actually exist, so a configured B2 key alone is enough.
      BACKUP_STORAGE: ${{ vars.BACKUP_STORAGE }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'newsbot-backups' }}
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME || 'newsbot-backups' }}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACL: private
      # Backblaze wants the application key ID as "account" and the application key as
      # "key"; the repository secret is named B2_APPLICATION_KEY_ID (not B2_ACCOUNT_ID).
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_APPLICATION_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve backup storage
        run: |
          storage="${BACKUP_STORAGE:-}"
          if [ -z "$storage" ]; then
            if [ -n "${RCLONE_CONFIG_B2_ACCOUNT:-}" ]; then
              storage=b2
            else
              storage=r2
            fi
          fi
          if [ "$storage" = "b2" ]; then
            bucket="${B2_BUCKET_NAME:-newsbot-backups}"
          else
            bucket="${R2_BUCKET_NAME:-newsbot-backups}"
          fi
          echo "BACKUP_REMOTE=$storage" >> "$GITHUB_ENV"
          echo "BACKUP_BUCKET=$bucket" >> "$GITHUB_ENV"
          echo "Selected storage: $storage (bucket: $bucket)"

      - name: Verify backup credentials are configured
        run: |
          missing=()
          [ -z "${DATABASE_URL:-}" ] && missing+=("DATABASE_URL")
          if [ "${BACKUP_REMOTE}" = "b2" ]; then
            [ -z "${RCLONE_CONFIG_B2_ACCOUNT:-}" ] && missing+=("B2_APPLICATION_KEY_ID")
            [ -z "${RCLONE_CONFIG_B2_KEY:-}" ] && missing+=("B2_APPLICATION_KEY")
            [ -z "${BACKUP_BUCKET:-}" ] && missing+=("B2_BUCKET_NAME")
          else
            [ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" ] && missing+=("R2_ACCESS_KEY_ID")
            [ -z "${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}" ] && missing+=("R2_SECRET_ACCESS_KEY")
            [ -z "${RCLONE_CONFIG_R2_ENDPOINT:-}" ] && missing+=("R2_ENDPOINT")
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Backup cannot run (storage=${BACKUP_REMOTE}), missing secret(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Run backup script
        run: bash scripts/backup.sh
