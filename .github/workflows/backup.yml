name: Scheduled Database Backup

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: scheduled-database-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Backup PostgreSQL to Cloudflare R2
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || 'newsbot-backups' }}
      BACKUP_RETENTION_DAYS: '7'
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACL: private
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify backup credentials are configured
        run: |
          missing=()
          [ -z "${DATABASE_URL:-}" ] && missing+=("DATABASE_URL")
          [ -z "${RCLONE_CONFIG_R2_ACCESS_KEY_ID:-}" ] && missing+=("R2_ACCESS_KEY_ID")
          [ -z "${RCLONE_CONFIG_R2_SECRET_ACCESS_KEY:-}" ] && missing+=("R2_SECRET_ACCESS_KEY")
          [ -z "${RCLONE_CONFIG_R2_ENDPOINT:-}" ] && missing+=("R2_ENDPOINT")
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Backup cannot run, missing secret(s): ${missing[*]}" >&2
            exit 1
          fi

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Run backup script
        run: bash scripts/backup.sh
