name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.15.2
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
          cache: pip

      - name: Install ruff
        run: pip install 'ruff>=0.8,<1'

      - name: Run ruff
        run: ruff check .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: newsbot_test
          POSTGRES_USER: newsbot
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U newsbot -d newsbot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://newsbot:test_password@127.0.0.1:5432/newsbot_test
      GEMINI_API_KEY: test_gemini_key_ci
      TELEGRAM_BOT_TOKEN: '123456789:TEST_BOT_TOKEN_CI'
      TELEGRAM_CHANNEL_ID: '-1009876543210'
      TELEGRAM_ADMIN_CHAT_ID: '987654321'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.15.2
        uses: actions/setup-python@v5
        with:
          python-version: '3.15.2'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps 'aiogram==3.22.0'
          pip install -r requirements-dev.txt

      - name: Run migrations on test DB
        run: alembic upgrade head

      - name: Run tests
        run: pytest -v --tb=short --cov=app --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7
