name: Inspect Backup Storage (read-only)

# Manual, read-only inspection of the backup bucket: it verifies the credentials, checks
# that the configured bucket exists, and lists the objects under db/. It never dumps,
# uploads, downloads, deletes or restores anything, so it is safe to run against
# production storage.
#
# The bucket is taken verbatim from B2_BUCKET_NAME; nothing is auto-selected from the
# buckets the key happens to see, and other bucket names are never printed. Only this
# job's own bucket is probed, which needs the listBuckets capability but not
# listAllBucketNames.

on:
  workflow_dispatch:

concurrency:
  group: backup-inspect
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  inspect:
    name: Inspect B2 backup bucket
    # Manual runs can be started from any branch, so restrict execution to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      B2_BUCKET_NAME: ${{ secrets.B2_BUCKET_NAME }}
      # rclone reads its remote configuration from RCLONE_CONFIG_<REMOTE>_* variables, so
      # no config file and no secret is written to disk.
      RCLONE_CONFIG_B2_TYPE: b2
      RCLONE_CONFIG_B2_ACCOUNT: ${{ secrets.B2_APPLICATION_KEY_ID }}
      RCLONE_CONFIG_B2_KEY: ${{ secrets.B2_APPLICATION_KEY }}

    steps:
      - name: Check required secrets
        run: |
          set -euo pipefail
          missing=()
          [ -z "${RCLONE_CONFIG_B2_ACCOUNT:-}" ] && missing+=("B2_APPLICATION_KEY_ID")
          [ -z "${RCLONE_CONFIG_B2_KEY:-}" ] && missing+=("B2_APPLICATION_KEY")
          [ -z "${B2_BUCKET_NAME:-}" ] && missing+=("B2_BUCKET_NAME")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Cannot inspect B2; missing secret(s): ${missing[*]}" >&2
            exit 1
          fi
          echo "Required secrets are present (values are never printed)."

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Verify the configured bucket is reachable
        # Probe only the bucket named by B2_BUCKET_NAME. Listing b2: would also request
        # the account's other buckets and can be denied for a bucket-scoped key; the
        # rclone/B2 error text can name those buckets, so it is not echoed.
        run: |
          set -euo pipefail
          target="b2:${B2_BUCKET_NAME}"
          if ! rclone lsd "$target" >/dev/null 2>/tmp/bucket-probe.err; then
            echo "::error::Backblaze bucket '${B2_BUCKET_NAME}' is not accessible with these credentials." >&2
            echo "Either B2_BUCKET_NAME does not match a bucket this key can reach, or the key lacks the listBuckets capability (a bucket-scoped key needs it to confirm the bucket exists)." >&2
            echo "No other bucket names are shown on purpose; re-check the key's bucket scope and capability in the Backblaze console." >&2
            exit 1
          fi
          echo "Bucket is reachable: ${B2_BUCKET_NAME}"

      - name: List db/ (read-only)
        run: |
          set -euo pipefail
          target="b2:${B2_BUCKET_NAME}/db/"
          echo "--- Objects under ${target} ---"
          if ! rclone lsjson "$target" --files-only > /tmp/db-listing.json; then
            echo "::error::Cannot list ${target}; the prefix may not exist or the key may lack read access." >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime

          with open("/tmp/db-listing.json", encoding="utf-8") as handle:
              objects = json.load(handle)

          if not objects:
              print("No objects under db/ (the prefix is empty or has not been created yet).")
              raise SystemExit(0)

          rows = sorted(
              objects,
              key=lambda item: item.get("ModTime", ""),
              reverse=True,
          )
          print(f"count: {len(rows)}")
          total = 0
          for item in rows:
              name = item.get("Path") or item.get("Name") or "<unnamed>"
              size = int(item.get("Size") or 0)
              total += size
              stamp = item.get("ModTime") or "unknown"
              try:
                  stamp = datetime.fromisoformat(stamp.replace("Z", "+00:00")).strftime("%Y-%m-%d %H:%M:%S UTC")
              except ValueError:
                  pass
              print(f"  {name}\t{size} bytes\t{stamp}")
          print(f"total bytes: {total}")
          PY
          echo "--- Read-only inspection finished; nothing was uploaded, downloaded or deleted. ---"
